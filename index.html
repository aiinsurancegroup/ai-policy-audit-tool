<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Policy Audit Tool — The AI Insurance Group</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🛡️</text></svg>" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; }
        /* Client document. Each section starts a page; nothing that reads as a
           unit is allowed to split across one. */
        .pdf-break { page-break-before: always; }
        .pdf-keep { break-inside: avoid; page-break-inside: avoid; }
        /* position: fixed repeats on every printed page, which is what a
           licence number in a footer has to do. */
        .pdf-footer { position: fixed; bottom: 0; left: 0; right: 0; }
        .pdf-doc { padding: 0 !important; }
      }
      @page { size: A4; margin: 14mm 14mm 20mm; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
